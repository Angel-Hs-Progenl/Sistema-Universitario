name: Verificación
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: uto
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: uto_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U uto -d uto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://uto:test-only-password@127.0.0.1:5432/uto_test
      DATABASE_URL: postgresql+psycopg://uto:test-only-password@127.0.0.1:5432/uto_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - run: npm ci
      - run: python -m pip install -r backend/requirements.lock.txt
      - run: npm test
      - run: npm run build
      - run: python -m pytest backend/tests -q
