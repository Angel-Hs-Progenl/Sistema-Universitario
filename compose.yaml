services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: uto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: uto
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uto -d uto"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
